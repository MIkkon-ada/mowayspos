name: CLOUD P1B2B-A private GHCR image publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit or publish application images
        required: true
        type: choice
        options: [audit, publish]
        default: audit

permissions:
  contents: read

concurrency:
  group: cloud-p1b2b-a-ghcr-private-image-publish
  cancel-in-progress: false

jobs:
  private-image-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKEND_REPOSITORY: ghcr.io/mikkon-ada/mowayspos-backend
      FRONTEND_REPOSITORY: ghcr.io/mikkon-ada/mowayspos-frontend
      BACKEND_LOCAL: mowayspos-publish-backend:${{ github.sha }}
      FRONTEND_LOCAL: mowayspos-publish-frontend:${{ github.sha }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate main branch and full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          echo "publish_sha=$GITHUB_SHA"

      - name: Validate operation mode
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in audit|publish) ;; *) exit 1 ;; esac

      - name: Build local backend and frontend images
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --no-cache -f Dockerfile.backend -t "$BACKEND_LOCAL" .
          docker build --pull --no-cache -f Dockerfile.frontend -t "$FRONTEND_LOCAL" .

      - name: Scan backend image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_LOCAL }}
          scanners: secret
          format: json
          output: ${{ runner.temp }}/backend-secret.json
          exit-code: '0'

      - name: Scan frontend image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_LOCAL }}
          scanners: secret
          format: json
          output: ${{ runner.temp }}/frontend-secret.json
          exit-code: '0'

      - name: Scan backend image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_LOCAL }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/backend-vulnerability.json
          exit-code: '0'

      - name: Scan frontend image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_LOCAL }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/frontend-vulnerability.json
          exit-code: '0'

      - name: Inspect image contents and Docker history
        shell: bash
        run: |
          set -euo pipefail
          for image in "$BACKEND_LOCAL" "$FRONTEND_LOCAL"; do
            labels=$(docker image inspect "$image" --format '{{json .Config.Labels}}')
            if grep -Fqi 'org.opencontainers.image.source' <<<"$labels"; then exit 1; fi
            if docker history --no-trunc --format '{{.CreatedBy}}' "$image" | grep -Eqi '(ghcr_publish_token|github_token|authorization|api[_-]?key|password|passwd|token|llm|tencent|secret|--build-arg[^|]*(token|password|secret|key))'; then exit 1; fi
          done
          docker run --rm --entrypoint sh "$BACKEND_LOCAL" -c 'test ! -e /app/.env; test ! -e /app/.git; test ! -e /app/.docker/config.json'
          docker run --rm --entrypoint sh "$FRONTEND_LOCAL" -c 'test ! -e /usr/share/nginx/html/.env; test ! -e /usr/share/nginx/html/.git; test ! -e /usr/share/nginx/html/node_modules'

      - name: Enforce sanitized scan results
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          failed = False
          for image in ("backend", "frontend"):
              secret_path = root / f"{image}-secret.json"
              vuln_path = root / f"{image}-vulnerability.json"
              if not secret_path.is_file() or not vuln_path.is_file():
                  print(f"{image}_scan_result=missing", file=sys.stderr)
                  failed = True
                  continue
              secret_data = json.loads(secret_path.read_text(encoding="utf-8"))
              vuln_data = json.loads(vuln_path.read_text(encoding="utf-8"))
              secrets = sum(len(result.get("Secrets") or []) for result in secret_data.get("Results") or [])
              records = {
                  (str(item.get("Severity") or "unknown"), str(item.get("VulnerabilityID") or "unknown"), str(item.get("PkgName") or "unknown"), str(item.get("InstalledVersion") or "unknown"), str(item.get("FixedVersion") or "unknown"))
                  for result in vuln_data.get("Results") or []
                  for item in result.get("Vulnerabilities") or []
                  if item.get("Severity") in {"HIGH", "CRITICAL"} and bool((item.get("FixedVersion") or "").strip())
              }
              print(f"{image}_secret_findings={secrets}")
              print(f"{image}_fixable_high_critical={len(records)}")
              for severity, vulnerability, package, installed, fixed in sorted(records):
                  print(f"vulnerability image={image} severity={severity} id={vulnerability} package={package} installed={installed} fixed={fixed}")
              failed = failed or bool(secrets) or bool(records)
          raise SystemExit(1 if failed else 0)
          PY

      - name: Report audit-only success
        if: ${{ inputs.operation == 'audit' }}
        shell: bash
        run: echo "audit_only=ok"

      - name: Log in to GHCR after all gates pass
        if: ${{ inputs.operation == 'publish' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Check immutable tags before publishing
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/manifest-inspect-error"
          require_absent() {
            local ref="$1"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>"$err"; then exit 1; fi
            grep -Eqi '(not found|manifest unknown|name unknown)' "$err"
            rm -f "$err"
          }
          BACKEND_TARGET="$BACKEND_REPOSITORY:$GITHUB_SHA"
          FRONTEND_TARGET="$FRONTEND_REPOSITORY:$GITHUB_SHA"
          echo "BACKEND_TARGET=$BACKEND_TARGET" >> "$GITHUB_ENV"
          echo "FRONTEND_TARGET=$FRONTEND_TARGET" >> "$GITHUB_ENV"
          require_absent "$BACKEND_TARGET"
          require_absent "$FRONTEND_TARGET"

      - name: Retag validated images
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          docker tag "$BACKEND_LOCAL" "$BACKEND_TARGET"
          docker tag "$FRONTEND_LOCAL" "$FRONTEND_TARGET"

      - name: Push immutable images
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          docker push --quiet "$BACKEND_TARGET" >/dev/null
          docker push --quiet "$FRONTEND_TARGET" >/dev/null

      - name: Verify remote image digests
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_pushed_digest() {
            local ref="$1"
            local expected remote
            expected=$(docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -F@ -v repo="${ref%:*}" '$1 == repo {print $2; exit}')
            remote=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [[ "$remote" =~ ^sha256:[0-9a-f]{64}$ && "$remote" == "$expected" ]]
          }
          verify_pushed_digest "$BACKEND_TARGET"
          verify_pushed_digest "$FRONTEND_TARGET"

      - name: Verify GHCR packages are private
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          for package in mowayspos-backend mowayspos-frontend; do
            metadata="$RUNNER_TEMP/ghcr-package-$package.json"
            tags="$RUNNER_TEMP/ghcr-package-$package-tags.txt"
            gh api "/user/packages/container/$package" > "$metadata"
            jq -e --arg expected "$package" '.name == $expected and .package_type == "container" and (.owner.login | ascii_downcase) == "mikkon-ada" and .visibility == "private"' "$metadata" >/dev/null
            gh api --paginate "/user/packages/container/$package/versions?per_page=100" --jq '.[].metadata.container.tags[]?' > "$tags"
            ! grep -Fxq -e latest -e main -e production "$tags"
            case "$package" in mowayspos-backend|mowayspos-frontend) expected_tag="$GITHUB_SHA" ;; *) exit 1 ;; esac
            grep -Fxq -- "$expected_tag" "$tags"
            rm -f "$metadata" "$tags"
          done

      - name: Cleanup publish credentials and temporary images
        if: always()
        shell: bash
        run: |
          set -u
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -f -- "$RUNNER_TEMP/backend-secret.json" "$RUNNER_TEMP/frontend-secret.json" "$RUNNER_TEMP/backend-vulnerability.json" "$RUNNER_TEMP/frontend-vulnerability.json" "$RUNNER_TEMP/manifest-inspect-error" "$RUNNER_TEMP"/ghcr-package-*.json "$RUNNER_TEMP"/ghcr-package-*-tags.txt
          refs=("$BACKEND_LOCAL" "$FRONTEND_LOCAL")
          for candidate in "${BACKEND_TARGET:-}" "${FRONTEND_TARGET:-}"; do
            if [[ -n "$candidate" ]]; then refs+=("$candidate"); fi
          done
          docker image rm "${refs[@]}" >/dev/null 2>&1 || true
